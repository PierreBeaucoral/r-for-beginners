<script>
// Course UI helpers, shared by the EN and FR pages (included via _quarto.yml).
document.addEventListener("DOMContentLoaded", () => {
  // 1. Compact session navigation, built from the navbar "Sessions" menu so it
  //    follows the page language. Shown only on session pages.
  const items = [...document.querySelectorAll("#navbarCollapse .dropdown-menu a.dropdown-item")]
    .filter(a => !a.closest("#languages-links") && /seance-\d\.html$/.test(new URL(a.href).pathname));
  const here = location.pathname.replace(/\/$/, "/index.html");
  const current = items.find(a => new URL(a.href).pathname === here);
  const header = document.querySelector("#title-block-header");
  if (current && header) {
    const toggle = current.closest(".dropdown")?.querySelector(".dropdown-toggle");
    const nav = document.createElement("nav");
    nav.className = "session-nav";
    nav.setAttribute("aria-label", toggle ? toggle.textContent.trim() : "Sessions");
    const label = document.createElement("span");
    label.className = "session-nav-label";
    label.textContent = nav.getAttribute("aria-label");
    nav.append(label);
    for (const a of items) {
      const text = a.textContent.trim();             // "3: Data manipulation ..."
      const link = document.createElement("a");
      link.href = a.href;
      link.textContent = text.split(/\s*:/)[0];       // "3"
      link.title = text;
      link.setAttribute("aria-label", text);
      if (a === current) link.setAttribute("aria-current", "page");
      nav.append(link);
    }
    header.before(nav);
  }

  // 2. Collapsible callouts (solutions): Quarto's toggle header is a plain div,
  //    so make it a real keyboard-operable button.
  document.querySelectorAll('.callout-header[data-bs-toggle="collapse"]').forEach(h => {
    h.setAttribute("role", "button");
    h.removeAttribute("aria-label");                  // let the visible title name it
    h.querySelector(".screen-reader-only")?.remove();   // drop the "Note" prefix
    h.setAttribute("tabindex", "0");
    h.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); h.click(); }
    });
  });

  // 3. Solution toggles say what they will do: "Show" when closed, "Hide" when open.
  const hideLabel = document.documentElement.lang.startsWith("fr") ? "Masquer la solution" : "Hide solution";
  const swap = (e, open) => {
    const h = document.querySelector(`.callout-header[aria-controls="${e.target.id}"]`);
    const title = h?.querySelector(".callout-title-container");
    if (!title) return;
    title.dataset.showLabel ??= title.textContent.trim();
    title.textContent = open ? title.dataset.showLabel.replace(/^(Show solution|Afficher la solution)/, hideLabel)
                             : title.dataset.showLabel;
  };
  document.addEventListener("show.bs.collapse", e => swap(e, true));
  document.addEventListener("hide.bs.collapse", e => swap(e, false));

  const fr = document.documentElement.lang.startsWith("fr");

  // 4. Skip link: keyboard users jump past the navbar and the contents list.
  const skip = document.createElement("a");
  skip.className = "skip-link";
  skip.href = "#quarto-document-content";
  skip.textContent = fr ? "Aller au contenu" : "Skip to content";
  document.body.prepend(skip);

  // 5. Phones: the right-hand contents list is hidden, so repeat it under the title.
  const toc = document.querySelector("#TOC > ul");
  if (toc && header) {
    const box = document.createElement("details");
    box.className = "toc-mobile";
    const summary = document.createElement("summary");
    summary.textContent = document.querySelector("#toc-title")?.textContent.trim() || (fr ? "Sur cette page" : "On this page");
    box.append(summary, toc.cloneNode(true));
    box.querySelectorAll("[id]").forEach(el => el.removeAttribute("id"));
    box.addEventListener("click", e => { if (e.target.closest("a")) box.open = false; });
    header.after(box);
  }

  // 6. Language switch: babelquarto renders a one-item dropdown; make it one click.
  const other = document.querySelector("#languages-links a.dropdown-item");
  const button = document.querySelector("#languages-button");
  if (other && button) {
    const link = document.createElement("a");
    link.className = "lang-switch";
    link.href = other.href;
    link.hreflang = other.id.replace("language-link-", "");
    link.lang = link.hreflang;
    link.textContent = other.textContent.trim();
    link.setAttribute("aria-label", fr ? "Read this page in English" : "Lire cette page en français");
    button.parentElement.replaceChildren(link);
  }

  // 7. Session pages: previous / next session at the bottom, from the same menu.
  if (current) {
    const i = items.indexOf(current);
    const pager = document.createElement("nav");
    pager.className = "session-pager";
    pager.setAttribute("aria-label", fr ? "Séance précédente et suivante" : "Previous and next session");
    const add = (a, cls, label) => {
      if (!a) return pager.append(document.createElement("span"));
      const link = document.createElement("a");
      link.href = a.href; link.className = cls;
      link.innerHTML = `<small>${label}</small><span></span>`;
      link.querySelector("span").textContent = a.textContent.trim();
      pager.append(link);
    };
    add(items[i - 1], "prev", fr ? "← Séance précédente" : "← Previous session");
    add(items[i + 1], "next", fr ? "Séance suivante →" : "Next session →");
    document.querySelector("main.content")?.append(pager);
  }

  // 8. French pages: translate the labels of the live R editor (quarto-live), which it renders in English.
  if (fr && document.querySelector(".exercise-cell, .qwebr-code-cell, [class*='exercise']")) {
    const words = { "Run Code": "Exécuter", "Start Over": "Recommencer", "R Code": "Code R",
                    "Show Hint": "Indice", "Show Solution": "Solution", "Hint": "Indice", "Solution": "Solution",
                    "Loading...": "Chargement…", "Copy": "Copier" };
    const translate = root => {
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      for (let n = walker.nextNode(); n; n = walker.nextNode()) {
        const key = n.nodeValue.trim();
        if (words[key] && !n.parentElement.closest("pre, code, .cm-editor")) n.nodeValue = n.nodeValue.replace(key, words[key]);
      }
    };
    translate(document.body);
    new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => n.nodeType === 1 && translate(n))))
      .observe(document.body, { childList: true, subtree: true });
  }

  // 9. Print: open folded code, and label solutions plainly.
  window.addEventListener("beforeprint", () => {
    document.querySelectorAll("details").forEach(d => { d.dataset.wasOpen = d.open; d.open = true; });
  });
  window.addEventListener("afterprint", () => {
    document.querySelectorAll("details").forEach(d => { d.open = d.dataset.wasOpen === "true"; });
  });
});
</script>
