name: Rendre et publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bibliothèques système requises par sf / rnaturalearth (cartes)
      - name: Dépendances système (GDAL, PROJ, GEOS, udunits)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev

      - name: Installer R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installe et met en cache les packages listés dans DESCRIPTION
      - name: Installer les packages R
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Grâce à _freeze/ (versionné), seuls les documents modifiés
      # ré-exécutent du R ; les autres réutilisent les résultats figés.
      - name: Rendre le site
        run: quarto render

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
