name: Rendre et publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26 (GDAL/PROJ for maps)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Le site ne doit exécuter aucun code R ici (readxl sur .xls plante R sous
      # Linux) : chaque page doit avoir des résultats figés à jour (tools/freeze.sh).
      - name: Vérifier les résultats figés (_freeze)
        run: python3 tools/check_freeze.py

      # Bibliothèques système requises par sf / rnaturalearth (cartes)
      - name: Dépendances système (GDAL, PROJ, GEOS, udunits)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev

      - name: Installer R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installe et met en cache les packages listés dans DESCRIPTION
      - name: Installer les packages R
        uses: r-lib/actions/setup-r-dependencies@v2

      # Aucun titre ou légende de graphique ne doit déborder de l'image (FR plus long)
      - name: Vérifier les figures (texte coupé)
        run: Rscript tools/check_figures.R

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # babelquarto rend la version anglaise (docs/) puis la française (docs/fr/)
      # et ajoute le bouton EN/FR. Aucun code R des séances n'est exécuté ici :
      # les deux langues viennent de _freeze/ (tools/freeze.sh, vérifié plus haut).
      - name: Rendre le site (EN + FR)
        run: Rscript -e 'babelquarto::render_website(preview = FALSE)'

      # babelquarto annonce les pages françaises en « X.fr.html » (hreflang) ;
      # elles sont servies en « X.html » sous /fr/ : on corrige ces liens.
      - name: Corriger les liens hreflang
        run: find docs -name '*.html' -exec sed -i -E '/hreflang/ s/\.fr\.html"/.html"/g' {} +

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26 (GDAL/PROJ for maps)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
