project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "seances/*.qmd"
    - "slides/*.qmd"
  pre-render: tools/make_scripts.R   # scripts/seance-N.R, per language
  resources:
    - data.zip
    - scripts/*.R
    - assets/fonts/*.woff2   # for slides/fonts.css

lang: en

babelquarto:
  languagelinks: navbar
  icon: "bi bi-translate"
  languagecodes:
    - name: en
      text: "EN"
    - name: fr
      text: "FR"
  mainlanguage: "en"
  languages: ["fr"]
title-fr: "R pour l'analyse de données : niveau débutant"
description-fr: "Cours d'initiation à R pour les étudiants du Master GPE (CERDI / IHEDD) : importer, manipuler, décrire, visualiser et présenter des données de développement."

website:
  title: "R for data analysis: beginner level"
  description: "Introductory R course for Master GPE students (CERDI / IHEDD): import, manipulate, describe, visualise and report development data."
  site-url: "https://pierrebeaucoral.github.io/r-for-beginners/"
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    title: "R for beginners"
    search: true
    right:
      - icon: github
        href: https://github.com/PierreBeaucoral/r-for-beginners
        aria-label: GitHub
  page-footer:
    left: "R for beginners · Master GPE (CERDI / IHEDD) · Pierre Beaucoral"
    right: "Built with [Quarto](https://quarto.org)."

format:
  html:
    theme:
      - cosmo
      - theme.scss
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    number-sections: false
    code-tools: false
    code-fold: false
    code-copy: true
    code-overflow: wrap
    fig-align: center
    fig-cap-location: bottom
    smooth-scroll: true
    grid:
      body-width: 880px
    include-after-body: assets/course-ui.html
    link-external-newwindow: true
    mermaid:
      theme: neutral

execute:
  freeze: auto
  warning: false
  message: false
  echo: true
